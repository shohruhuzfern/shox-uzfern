name: Loyiha tugashi xabarnomasi

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-completed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bog'liqliklarni o'rnatish
        run: npm install

      - name: Playwright brauzerini o'rnatish
        run: npx playwright install --with-deps chromium

      - name: Tugagan loyihalarni tekshirish
        env:
          PAGE_URL: ${{ vars.PAGE_URL }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-completed-projects.js
